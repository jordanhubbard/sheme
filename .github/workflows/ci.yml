name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Full Bash and zsh gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out sheme
        uses: actions/checkout@v4

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y bats zsh

      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bash bats-core
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Show shell versions
        run: |
          bash --version | head -1
          zsh --version
          bats --version

      - name: Run interpreter, compiler, extension, and example regressions
        run: make test-all

      - name: Run maintained Bash and zsh examples
        run: make example
